  <text x="96" y="230" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="2">PLATAFORMA EDUCACIONAL</text>
  <text x="96" y="330" fill="#eef4ff" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800">BSpace</text>
  <text x="102" y="405" fill="#bfd2ff" font-family="Arial, Helvetica, sans-serif" font-size="38">Astronomia interativa com planetas 3D, Academia,</text>
  <text x="102" y="455" fill="#bfd2ff" font-family="Arial, Helvetica, sans-serif" font-size="38">missões, calendário astronômico e quizzes.</text>
